[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helsinki"
version = "0.1.0"
description = "Neonatal EEG seizure detection on the Helsinki dataset"
requires-python = ">=3.11"
dependencies = [
    "mne>=1.13",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "PyWavelets>=1.6",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["helsinki"]
